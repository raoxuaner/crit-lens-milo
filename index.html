<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A robot design workbench for comparing concepts, refining components and trying AI suggestion timing during prototyping."><title>Crit Lens — AI Robot Design Workbench</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workflow.css"><link rel="stylesheet" href="robot.css"></head><body>
<aside id="sidebar"><div class="brand-row"><a href="./" class="brand"><span class="brand-symbol">◔</span>Crit Lens</a><button class="icon-btn" id="collapseSidebar" aria-label="Collapse sidebar"></button></div><div class="search-wrap"><span id="searchIcon"></span><input id="search" placeholder="Search" aria-label="Search projects"></div><p class="side-label">WORKSPACE</p><button class="side-button" id="newProject"><span>⊕</span>New Project</button><button class="side-button" id="showProjects"><span>▱</span>Projects <small id="projectCount">1</small></button><p class="side-label recent-label">RECENT</p><div id="projectList"></div><div class="account"><span class="avatar">S</span><div>seona<small>Personal workspace</small></div><button id="settings" class="icon-btn" aria-label="Workspace settings"></button></div></aside>
<main id="workspace"><header><button id="expandSidebar" class="icon-btn" aria-label="Expand sidebar" hidden>☰</button><input id="projectName" aria-label="Project name" maxlength="90"><nav class="steps" aria-label="Design workflow"><button data-phase="0" class="current"><span>1</span>Express Intent</button><button data-phase="1"><span>2</span>Clarify</button><button data-phase="2"><span>3</span>Check & Refine</button></nav><div class="header-right"><button id="robotLab" title="Try two suggestion timings during robot assembly">Prototype Lab</button><button class="local-pill" id="modeBadge" title="AI mode and workspace settings">Scenario preview</button><button id="share" class="dark-button">Share</button><button id="inspiration" class="icon-btn floating-icon" aria-label="Open inspiration" title="Inspiration"></button><button id="assistant" class="icon-btn floating-icon sparkle" aria-label="Open AI assistant" title="AI assistant"></button></div></header>
<div id="viewport" tabindex="0" aria-label="Design whiteboard"><div id="world"><svg id="connections" aria-hidden="true"></svg><div id="nodes"></div></div><section id="emptyWorkspace" hidden><h2>No projects yet</h2><p>Start a new design workflow.</p><button id="newEmptyProject" class="dark-button">New project</button></section></div><div class="bottom-status"><span class="save-dot"></span><span id="saveStatus">Saved on this device</span><span class="status-divider"></span><button id="about">AI Robot Design Workbench</button></div><div class="canvas-tools" role="toolbar" aria-label="Canvas tools"><button class="tool active" data-tool="pointer" aria-label="Pointer tool" title="Pointer (V)"></button><button class="tool" data-tool="intent" aria-label="Add intent card" title="Add intent card"></button><button class="tool" data-tool="image" aria-label="Add image" title="Add image"></button><button class="tool" data-tool="text" aria-label="Add canvas text" title="Text (T)"></button><button class="tool" data-tool="comment" aria-label="Add comment" title="Comment (C)"></button><button class="tool" data-tool="sticker" aria-label="Add sticker" title="Sticker"></button></div><div class="zoom-controls"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomReset" aria-label="Reset zoom to 100%">100%</button><button id="zoomIn" aria-label="Zoom in">+</button><span></span><button id="fit" class="icon-btn" aria-label="Fit whole flow" title="Fit whole flow (0)"></button><button id="jump" class="icon-btn" aria-label="Navigate steps" title="Navigate steps"></button></div></main>
<aside id="drawer" hidden><div class="drawer-title"><div><span id="drawerIcon"></span><h2 id="drawerTitle">AI assistant</h2></div><button id="closeDrawer" class="icon-btn" aria-label="Close side panel">×</button></div><div id="drawerBody"></div></aside><dialog id="modal"><button id="closeModal" class="icon-btn close" aria-label="Close dialog">×</button><div id="modalBody"></div></dialog><input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="importFile" accept="application/json,.json" hidden><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
